name: EURUSD Dual 30M and 4H Quantum Engine

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 21-23 * * 0'
    - cron: '*/15 * * * 1-4'
    - cron: '*/15 0-22 * * 5'
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force AI model retraining (true/false)'
        required: false
        default: 'false'

concurrency:
  group: eurusd-quantum-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:./src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      SYMBOL_ID: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: 1. Fetch Live Market Data and Spot Price (cTrader)
        run: python src/data.py

      - name: 2. Daily AI Model Retraining (Once Per Day or Forced)
        run: |
          TODAY_UTC=$(date -u +'%Y-%m-%d')
          FORCE_TRAIN=$(echo "${{ github.event.inputs.force_train }}" | tr '[:upper:]' '[:lower:]')
          LAST_DATE=""
          if [ -f "last_trained.txt" ]; then
            LAST_DATE=$(cut -c 1-10 last_trained.txt)
          fi

          if [ "$FORCE_TRAIN" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "FORCING model retrain: Removing local models..."
            rm -f *.pkl last_trained.txt
          fi

          if [ ! -f "model_30m.pkl" ] || [ ! -f "model_4h.pkl" ] || [ "$LAST_DATE" != "$TODAY_UTC" ]; then
            echo "Running EUR/USD AI Model Training on Full Historical Dataset..."
            python src/train.py
            date -u +'%Y-%m-%dT%H:%M:%SZ' > last_trained.txt

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f model_30m.pkl model_4h.pkl last_trained.txt
            git commit -m "chore: update daily EURUSD models ($TODAY_UTC) [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Skipping training! Models already trained today ($TODAY_UTC)."
          fi

      - name: 3. Run AI Prediction Engine
        run: python src/predict.py

      - name: 4. Run Grid State Validator
        run: python src/validator.py
